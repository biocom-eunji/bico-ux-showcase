<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리 · TO-BE</title>
<style>
@font-face{font-family:P-M;src:url(https://biocom-eunji.github.io/assets/assets/fonts/Pretendard-Medium.7305f90c923d4409825ec2f4380b63d6.ttf)}
@font-face{font-family:P-SB;src:url(https://biocom-eunji.github.io/assets/assets/fonts/Pretendard-SemiBold.459eff7ba5380583ccd6eda49c846c85.ttf)}
@font-face{font-family:P-B;src:url(https://biocom-eunji.github.io/assets/assets/fonts/Pretendard-Bold.dfb614ebecd405875f50a918ca11c17c.ttf)}
:root{--fg:#171719;--mid:#5a5c63;--mute:#72747b;--line:#e4e4e7;--face:#f6f8f9;--mint:#22c3bc;--mint-d:#157d78;--mint-bg:#e1f6f5;--org:#b04a00;--org-bg:#fde9d8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{color:var(--fg);font-family:P-M,'Pretendard',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:linear-gradient(180deg,#e4f3f0 0,#f4f8f8 320px,#f6f8f9 100%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.top{position:sticky;top:0;z-index:5;height:48px;display:flex;align-items:center;justify-content:center;background:rgba(238,246,245,.92);backdrop-filter:blur(8px)}
.top .back{position:absolute;left:4px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;text-align:center}
.top h1{font-size:16px;font-family:P-SB,sans-serif;font-weight:400}
main{padding:4px 16px 40px;display:flex;flex-direction:column;gap:12px}
.card{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 4px 14px rgba(23,23,25,.06);padding:16px}
.h{font-size:16px;font-family:P-B,sans-serif;font-weight:400}
.sub{font-size:12px;color:var(--mute);margin-top:2px;line-height:1.4}
/* 머리 */
.eye{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.score{display:flex;align-items:flex-end;gap:10px;margin-top:6px}
.score b{font-size:44px;line-height:44px;letter-spacing:-1.5px;font-family:P-B,sans-serif;font-weight:400}
.score span{font-size:12px;color:var(--mute);padding-bottom:5px}
.dl{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-family:P-SB,sans-serif;background:var(--face);color:var(--mid);margin-bottom:5px}
.dl.up{background:var(--mint-bg);color:var(--mint-d)}
.fo{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--org-bg);color:var(--org);font-family:P-SB,sans-serif;margin-left:4px}
.path{margin-top:12px;padding:12px;border-radius:12px;background:var(--face)}
.path .k{font-size:12px;color:var(--mute)}
.path .ch{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.path .ch span{font-size:12px;font-family:P-SB,sans-serif;padding:5px 8px;border-radius:6px;background:#fff;border:1px solid var(--line)}
.path .ch span.me{background:var(--fg);color:#fff;border-color:var(--fg)}
.path .ch i{font-style:normal;color:#a1a4ab;font-size:12px}
.path .im{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px;font-family:P-SB,sans-serif;min-height:44px;width:100%}
.path .im b{font-size:16px;color:var(--mint-d);font-family:P-B,sans-serif;font-weight:400}
.path .im b.dn{color:var(--mid)}
.path .im em{font-style:normal;font-size:12px;color:var(--mute);margin-left:6px;font-family:P-M,sans-serif}
.today{display:flex;align-items:center;gap:10px;margin-top:12px}
.st{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;flex:1}
.st i{width:8px;height:8px;border-radius:50%;box-sizing:border-box;flex:none}
.st.todo{color:var(--fg)}.st.todo i{border:1.5px solid var(--mute);background:#fff}
.st.ok{color:var(--mute)}.st.ok i{background:var(--mint)}
.cta{height:44px;padding:0 16px;border-radius:12px;background:var(--mint);color:#06403c;font-family:P-SB,sans-serif;font-size:14px;text-align:center;display:inline-flex;align-items:center;justify-content:center;flex:none}
.dir{margin-top:10px;font-size:12px;color:var(--mid);line-height:1.5}
/* 오늘 할 일 */
.todo{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;margin-top:8px;border-radius:12px;background:var(--face);width:100%}
.todo .ic{width:32px;height:32px;border-radius:50%;background:var(--mint-bg);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.todo .tx{flex:1;min-width:0}.todo .tx b{display:block;font-size:14px;font-family:P-SB,sans-serif;font-weight:400}.todo .tx small{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.todo .tg{font-size:11px;color:var(--mint-d);font-family:P-SB,sans-serif}
.todo .rec{height:34px;padding:0 14px;border-radius:8px;background:var(--mint);color:#06403c;font-family:P-SB,sans-serif;font-size:12px;display:inline-flex;align-items:center;flex:none}
.todo .pill{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--mid);display:inline-flex;align-items:center;flex:none;background:#fff}
/* 기록 항목 */
.items{padding:4px 16px}
.it{padding:14px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.r1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.nm{font-size:14px;font-family:P-SB,sans-serif;display:flex;align-items:center;gap:6px}
.imp{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--org-bg);color:var(--org);font-family:P-SB,sans-serif}
.pl{font-size:12px;font-family:P-SB,sans-serif;padding:4px 8px;border-radius:999px;background:var(--face);color:var(--mid);white-space:nowrap}
.pl.good{background:var(--mint-bg);color:var(--mint-d)}
.val{font-size:20px;line-height:26px;font-family:P-B,sans-serif;margin-top:4px}
.val small{font-size:12px;color:var(--mute);font-family:P-M,sans-serif;margin-left:6px}
.std{font-size:12px;color:var(--mute);margin-top:2px}
.viz{position:relative;margin-top:10px;display:flex;align-items:flex-end;justify-content:space-between;height:48px;padding-bottom:0}
.viz .b{flex:1;display:flex;justify-content:center;align-items:flex-end;height:100%}
.viz .b i{width:22px;border-radius:4px 4px 0 0;background:#d4d6db;display:block}
.viz .b.on i{background:#8e929b}
.viz .ref{position:absolute;left:0;right:0;border-top:1.5px dashed #9aa0a8;pointer-events:none}
.dots .b{align-items:center}.dots .b i{width:10px;height:10px;border-radius:50%;background:#d4d6db}.dots .b.y i{background:var(--mint)}
.days{display:flex;justify-content:space-between;margin-top:4px}
.days span{flex:1;text-align:center;font-size:11px;color:var(--mute)}.days span:last-child{color:var(--fg);font-family:P-SB,sans-serif}
.rd{margin-top:8px;font-size:12px;line-height:1.5;color:var(--mid)}
.rd .t{color:var(--mute)}
.ft{display:flex;align-items:center;gap:8px;margin-top:8px}
.ft .tag{font-size:11px;color:var(--mint-d);background:var(--mint-bg);border-radius:6px;padding:3px 7px;font-family:P-SB,sans-serif}
.ft .more{margin-left:auto;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-family:P-SB,sans-serif;display:inline-flex;align-items:center;background:#fff}
.ft .more.rec{background:var(--mint);border-color:var(--mint);color:#06403c}
.empty{text-align:center;padding:28px 8px}
.empty .ic{font-size:32px}
.empty h2{font-size:16px;font-family:P-B,sans-serif;font-weight:400;margin-top:8px}
.empty p{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.5}
.empty .cta{margin-top:16px;width:100%}
</style></head><body>
<div class="top"><button class="back" data-nav="/" aria-label="뒤로">‹</button><h1 id="ttl">관리</h1></div>
<main id="root"></main>

 items:[

  '<div class="std">'+it.std+'</div>'+(it.vals||it.dots?viz(it):'')+
  (it.rd&&it.rd.length?'<div class="rd">'+it.rd.map(function(x,i){return '<div'+(i?' class="t"':'')+'>'+x+'</div>'}).join('')+'</div>':'')+
  '<div class="ft">'+(it.today?'<span class="tag">오늘 할 일</span><span style="font-size:12px;color:var(--mid)">'+it.today+'</span>':'')+(it.tagx?'<span class="tag" style="background:var(--face);color:var(--mid)">'+it.tagx+'</span>':'')+
  (it.rec?'<button class="more rec" data-nav="'+d.nav+'">기록하기</button>':'<button class="more" data-nav="'+d.nav+'">'+it.more+' ›</button>')+'</div></div>'}).join('')+'</section>'}
document.getElementById('root').innerHTML=html;
</script>
